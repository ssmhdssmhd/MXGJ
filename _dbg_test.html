<!DOCTYPE html><html><head><meta charset="utf-8"><title>postMessage 测试</title>
<style>body{font-family:monospace;padding:15px;background:#1a1a2e;color:#eee}
iframe{width:100%;height:350px;border:2px solid #444;border-radius:8px}pre{background:#000;border:1px solid #333;padding:10px;border-radius:6px;max-height:400px;overflow:auto}</style></head><body>
<h2>postMessage 接收测试</h2>
<pre id="log"></pre>
<h3>独立打开（手动点开看结果）</h3>
<div><a href="/player/play_debug.php?code=lgzym3u8&url=https://lgvideo.xyz/player/caTBbS3v" target="_blank">点击打开独立页面</a></div>
<h3>内嵌 iframe（等 3 秒后看上面的日志）</h3>
<iframe src="/player/play_debug.php?code=lgzym3u8&url=https://lgvideo.xyz/player/caTBbS3v"></iframe>
<script>
var logEl = document.getElementById('log');
function onMsg(e){
    var d = e.data;
    if (d && d.type === 'dbg') {
        var div = document.createElement('div');
        div.textContent = '[from iframe] ' + d.msg;
        logEl.appendChild(div);
    }
}
window.addEventListener('message', onMsg);
</script>
</body></html>
