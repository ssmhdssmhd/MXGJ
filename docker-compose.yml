version: '3.8'

services:
  mxgj:
    build: .
    image: mxgj:latest
    container_name: mxgj
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 挂载 data 目录到宿主机，持久化
      - ./data:/var/www/html/data
      - ./config:/var/www/html/config
    command: php -S 0.0.0.0:8080 -t /var/www/html
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/index.php", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
