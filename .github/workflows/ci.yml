name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-check:
    name: PHP Syntax + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, json, openssl
          coverage: none

      - name: PHP Syntax Check
        run: |
          echo "=== PHP Syntax Check ==="
          find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' | while read f; do
            php -l "$f" || exit 1
          done
          echo "✅ All PHP files pass syntax check"

      - name: Run Tests (PHP 8.1+ only)
        if: matrix.php-version == '8.1' || matrix.php-version == '8.2' || matrix.php-version == '8.3'
        run: |
          echo "=== Running tests ==="
          php tests/run_test.php || echo "⚠️ Some tests failed (network-dependent, check manually)"
